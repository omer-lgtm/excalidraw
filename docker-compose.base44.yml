services:
  excalidraw:
    image: node:24-bookworm
    container_name: excalidraw-dev
    working_dir: /opt/node_app
    command: >
      sh -c "printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/xdg-open && chmod +x /usr/local/bin/xdg-open &&
             yarn install --frozen-lockfile --network-timeout 600000 &&
             yarn --cwd excalidraw-app vite --host 0.0.0.0 --port 3000 --strictPort"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Vite reads VITE_APP_PORT from env; pin to 3000 for the preview
      - VITE_APP_PORT=3000
      # disable the auto-open-browser behaviour (no GUI in container)
      - VITE_APP_DISABLE_LIVE_RELOAD=
    volumes:
      - ./:/opt/node_app
      - excalidraw_node_modules:/opt/node_app/node_modules
      - excalidraw_app_node_modules:/opt/node_app/excalidraw-app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: on-failure

volumes:
  excalidraw_node_modules:
  excalidraw_app_node_modules:
